apiVersion: v1
kind: Secret
metadata:
  name: careertrack-postgres
type: Opaque
data:
  POSTGRES_DB: {{ .Values.postgres.database | b64enc | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@postgres:5432/%s" .Values.postgres.username .Values.postgres.password .Values.postgres.database | b64enc | quote }}
